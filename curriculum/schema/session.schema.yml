# Schema for workshop session YAML files
type: object
required:
  - id
  - title
  - week
  - duration
  - objectives
  - agenda
  - topics
  - prior_knowledge
  - activities
  - assessment

properties:
  id:
    type: string
    pattern: "^week\\d{2}-[a-z-]+$"
    description: "Session identifier (e.g., week01-recursion)"

  title:
    type: string
    minLength: 5
    maxLength: 100
    description: "Session title"

  week:
    type: integer
    minimum: 0
    maximum: 12
    description: "Week number (0-12)"

  date:
    type: string
    pattern: "^\\d{4}-\\d{2}-\\d{2}$"
    description: "ISO date format (YYYY-MM-DD), compiled from schedule"

  duration:
    type: string
    default: "90 minutes"
    description: "Session duration"

  location:
    type: string
    description: "Physical or virtual location"

  delivery:
    type: string
    enum: ["in-person", "virtual", "hybrid"]
    default: "in-person"

  objectives:
    type: array
    minItems: 3
    maxItems: 6
    items:
      type: string
      minLength: 10
    description: "Learning objectives using action verbs (Bloom's taxonomy)"

  agenda:
    type: array
    minItems: 4
    items:
      type: object
      required: ["time", "activity"]
      properties:
        time:
          type: string
          pattern: "^\\d{1,2}:\\d{2}$"
          description: "Time in HH:MM format"
        activity:
          type: string
          minLength: 5
        duration:
          type: integer
          minimum: 5
          maximum: 60
          description: "Duration in minutes"
    description: "Session agenda with time slots"

  topics:
    type: array
    items:
      type: string
      enum:
        - "DSA"
        - "Arrays"
        - "Sorting"
        - "Trees"
        - "Graphs"
        - "DP"
        - "Recursion"
        - "System-Design"
        - "Cloud"
        - "K8s"
        - "ML"
        - "DevOps"
        - "Networking"
        - "Git"
        - "Setup"
    description: "Topic tags for resource matching"

  resources:
    type: object
    properties:
      core:
        type: array
        items:
          type: object
          required: ["title", "url", "why"]
          properties:
            title:
              type: string
            url:
              type: string
              format: uri
            why:
              type: string
              maxLength: 100
      enrichment:
        type: array
        items:
          type: object
          required: ["title", "url"]
          properties:
            title:
              type: string
            url:
              type: string
              format: uri

  prior_knowledge:
    type: array
    minItems: 1
    maxItems: 5
    items:
      type: string
      minLength: 5
    description: "Prerequisites students should know"

  activities:
    type: array
    minItems: 1
    items:
      type: object
      required: ["type", "title", "steps"]
      properties:
        type:
          type: string
          enum: ["lab", "demo", "coding", "discussion", "quiz"]
        title:
          type: string
          minLength: 5
        steps:
          type: array
          items:
            type: string
        time_minutes:
          type: integer
          minimum: 5
          maximum: 45

  assessment:
    type: array
    minItems: 1
    items:
      type: object
      required: ["type"]
      properties:
        type:
          type: string
          enum: ["leetcode", "project", "quiz", "reflection"]
        ids:
          type: array
          items:
            type: integer
          description: "LeetCode problem IDs"
        instructions:
          type: string
        project_description:
          type: string

  speaker_notes:
    type: object
    properties:
      beats:
        type: array
        items:
          type: string
          minLength: 10
        description: "Speaker talking points with timing cues"
      time_cues:
        type: array
        items:
          type: object
          properties:
            minute:
              type: integer
            note:
              type: string
      demo_steps:
        type: array
        items:
          type: string
      faq:
        type: array
        items:
          type: object
          properties:
            question:
              type: string
            answer:
              type: string

  style:
    type: object
    properties:
      theme:
        type: string
        enum: ["academic", "minimal", "technical"]
        default: "academic"
      layout:
        type: string
        enum: ["single-column", "two-column", "grid"]
        default: "single-column"
      callouts:
        type: array
        items:
          type: string
          enum: ["do-dont", "tip", "caution", "career", "industry"]
      slide_count_target:
        type: integer
        minimum: 15
        maximum: 35
        default: 25

  industry_tip:
    type: object
    properties:
      title:
        type: string
      bullets:
        type: array
        items:
          type: string
      source:
        type: string
        description: "Reference to Success With SCE slide"
