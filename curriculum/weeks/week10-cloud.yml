id: "week10-cloud"
title: "Cloud & Distributed Systems"
week: 10
duration: "90 minutes"
topics: ["Cloud","DevOps"]
objectives:
  - "Implement a minimal Terraform stack and verify idempotent applies."
  - "Containerize a service and deploy to Kubernetes; roll forward/back."
  - "Measure autoscaling behavior with HPA under synthetic load."
agenda:
  - time: "16:00"
    activity: "Warm-up: Well-Architected pillars"
    duration: 10
  - time: "16:10"
    activity: "IaC: Terraform mini-stack"
    duration: 20
  - time: "16:30"
    activity: "K8s: containerize & deploy"
    duration: 25
  - time: "16:55"
    activity: "HPA: load test & observe"
    duration: 20
  - time: "17:15"
    activity: "Wrap up session"
    duration: 5
resources:
  core:
    - title: "AWS Well-Architected Framework (overview)"
      url: "https://docs.aws.amazon.com/wellarchitected/latest/framework/the-six-pillars.html"
      why: "Shared language for reliability, performance, and cost."
    - title: "Terraform — Getting Started"
      url: "https://developer.hashicorp.com/terraform/tutorials/aws-get-started"
      why: "Declarative infra with idempotent plans/applies."
    - title: "Kubernetes — Concepts"
      url: "https://kubernetes.io/docs/concepts/overview/"
      why: "Core objects and rollout strategies relevant to interviews."
  enrichment:
    - title: "GitHub Actions — Deploy Workflows"
      url: "https://docs.github.com/actions/deployment"
      why: "Hook CI/CD to your cluster or cloud."
prior_knowledge:
  - "Use Dockerfiles and push/pull images."
  - "Read YAML manifests and basic kubectl commands."
activities:
  - type: "lab"
    title: "IaC → K8s pipeline"
    time_minutes: 25
    steps:
      - "Provision a minimal VPC or namespace with Terraform; run apply twice to confirm idempotency."
      - "Build a container image; deploy a Deployment + Service."
      - "Configure an HPA on CPU; run a load generator and observe scaling."
      - "Perform a controlled rollback and verify availability."
assessment:
  - type: "project"
    instructions: "Submit a short screencast or log showing: `terraform plan` → `apply`, `kubectl rollout status`, HPA scaling events, and one rollback. Add a 1-page note on failure modes and mitigations."
style:
  theme: "academic"
  layout: "two-column"
  callouts: ["do-dont", "tip"]
  slide_count_target: 22
speaker_notes:
  beats:
    - "IaC is about repeatability; drift is your hidden enemy."
    - "K8s primitives: Deployment, Service, HPA—interview essentials."
    - "Autoscaling demo shows elasticity; mention metrics and SLOs."
    - "Rollbacks and health checks build credibility."
  time_cues:
    - minute: 10
      note: "show a Terraform plan."
    - minute: 30
      note: "deploy and inspect pods."
    - minute: 55
      note: "start load and watch HPA events."
  demo_steps:
    - "Run `terraform apply` twice to show no changes."
    - "Deploy image; edit deployment to roll a new version."
    - "Trigger load; view `kubectl top pods`."
  faq:
    - question: "Do interviews require cloud accounts?"
      answer: "No; discuss patterns and trade-offs clearly and you'll score well."
