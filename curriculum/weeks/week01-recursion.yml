id: "week01-recursion"
title: "DSA I — Recursion & Master Theorem"
week: 1
duration: "90 minutes"

objectives:
  - "Analyze divide-and-conquer recurrences using recursion trees."
  - "Apply Master Theorem cases to compute tight asymptotic bounds."
  - "Implement a small runtime estimator to compare theory vs. measurements."
  - "Prove a bound for T(n)=2T(n/2)+cn using tree summation."
  - "Compare recursion and iteration trade-offs for stack depth and readability."

agenda:
  - time: "16:00"
    activity: "Warm-up: 8-minute recap clip"
    duration: 5
  - time: "16:05"
    activity: "Recursion trees: build & sum levels"
    duration: 20
  - time: "16:25"
    activity: "Master Theorem: pick the right case"
    duration: 15
  - time: "16:40"
    activity: "Lab: runtime estimator"
    duration: 20
  - time: "17:00"
    activity: "Drill & wrap"
    duration: 25

topics:
  - "DSA"
  - "Recursion"

prior_knowledge:
  - "Define big-O, big-Ω, and big-Θ."
  - "Identify base case and recursive case in simple code."
  - "Trace stack frames for a recursive function."

activities:
  - type: "lab"
    title: "Estimator mini-lab"
    time_minutes: 20
    steps:
      - "Write a function that runs your algorithm at sizes n ∈ {2^10,…,2^18}."
      - "Record runtimes and plot n vs time."
      - "Overlay predicted growth (n, n log n, n^2) and discuss fit."
      - "Commit a short note: which Master Theorem case matched and why."

assessment:
  - type: "leetcode"
    ids: [53, 121]
    instructions: "Solve LC 53 (use divide-and-conquer Kadane variant) and LC 121 (linear scan). For LC 53, analyze whether your approach is O(n) or O(n log n) and justify with a recurrence or exchange argument."

resources:
  core:
    - title: "MIT OCW 6.046 — Divide & Conquer"
      url: "https://ocw.mit.edu/courses/6-046j-introduction-to-algorithms-sma-5503-fall-2005/"
      why: "Formal treatment of recurrences and tight bounds."
    - title: "Algorithm Visualizer — Recursion Examples"
      url: "https://algorithm-visualizer.org/"
      why: "Experiment to build intuition before proving."
    - title: "Tech Interview Handbook — Big-O Cheatsheet"
      url: "https://www.techinterviewhandbook.org/algorithms/big-o-cheatsheet/"
      why: "Quick reference for complexity when checking your solutions."
  enrichment:
    - title: "Algorithms Explained (video) — Recursion Trees"
      url: "https://www.youtube.com/playlist?list=PLLlTVphLQsuMtyeB91jyHXu5GtONlRLKR"
      why: "Visual walkthroughs that align with warm-ups."

speaker_notes:
  beats:
    - "Tie recursion trees to geometric series; the base dominates vs leaves dominate."
    - "Case selection: compare f(n) to n^{log_b a} with a concrete numeric example."
    - "Bridge to practice: when a recurrence is messy, estimate by levels."
    - "Estimator demo proves value of empirical checks."
    - "Preview: sorting recurrences next week."
  time_cues:
    - minute: 10
      note: "draw the first two levels of the tree live."
    - minute: 30
      note: "show the three cases with contrasting examples."
    - minute: 55
      note: "start estimator; remind to commit plots."
    - minute: 80
      note: "final Q&A."
  demo_steps:
    - "Expand T(n)=2T(n/2)+n into a tree and sum c·n per level."
    - "Show T(n)=3T(n/2)+n^2 as a contrasting case."
    - "Run the estimator at multiple n and produce a quick plot."
  faq:
    - question: "What if the recurrence doesn't match any clean Master Theorem case?"
      answer: "Use expansion or Akra–Bazzi; for interviews, argue by upper/lower bounding."
    - question: "Is divide-and-conquer always recursive in code?"
      answer: "Often, but you can replace recursion with an explicit stack if needed."
    - question: "Why compare to empirical curves?"
      answer: "Catches constant-factor surprises and validates your mental model."

industry_tip:
  title: "Quality Over Quantity in Interview Practice"
  bullets:
    - "Solve 50-100 problems deeply rather than 500 problems superficially"
    - "Practice explaining your approach out loud - communication matters as much as coding"
    - "Time yourself but don't stress about speed initially - correctness and clarity first"
    - "Keep a problem journal noting patterns and techniques that repeatedly appear"
    - "Join hackathons to practice under pressure and build portfolio projects"
  source: "Success With SCE slides p.8-10"

style:
  theme: "academic"
  layout: "two-column"
  callouts: ["do-dont", "tip"]
  slide_count_target: 22
