id: "week00-setup"
title: "Setup & Baseline Assessment"
week: 0
duration: "90 minutes"

objectives:
  - "Configure a consistent development environment with VS Code and essential extensions"
  - "Establish Git workflow fundamentals for version control and collaboration"
  - "Create a structured testing harness for practicing coding problems"
  - "Assess current technical skills and identify growth areas"
  - "Understand the structure and expectations of the 12-week program"

agenda:
  - time: "16:00"
    activity: "Welcome & introductions"
    duration: 10
  - time: "16:10"
    activity: "Program overview and expectations"
    duration: 15
  - time: "16:25"
    activity: "Development environment setup"
    duration: 25
  - time: "16:50"
    activity: "Git fundamentals workshop"
    duration: 20
  - time: "17:10"
    activity: "Baseline assessment (2 coding problems)"
    duration: 15
  - time: "17:25"
    activity: "Q&A and next steps"
    duration: 5

topics:
  - "Setup"
  - "Git"

prior_knowledge:
  - "Basic command line navigation (cd, ls, mkdir)"
  - "Understanding of what Git is conceptually"
  - "Text editor experience (any editor is fine)"

activities:
  - type: "lab"
    title: "IDE Setup and Configuration"
    time_minutes: 25
    steps:
      - "Download and install VS Code from https://code.visualstudio.com/"
      - "Install essential extensions: Python, GitLens, Code Runner, Bracket Pair Colorizer"
      - "Configure user settings for consistent coding style (tab size, auto-save)"
      - "Create a dedicated 'interview-prep' folder structure"
      - "Test setup by creating a simple Hello World program"
  - type: "demo"
    title: "Git Workflow Fundamentals"
    time_minutes: 20
    steps:
      - "Initialize a new Git repository in interview-prep folder"
      - "Configure git config --global user.name and user.email"
      - "Practice git add, commit, and status commands"
      - "Create a GitHub repository and connect with git remote add origin"
      - "Make your first push to GitHub"

assessment:
  - type: "leetcode"
    ids: [1, 121]
    instructions: "Solve in 15 minutes total. Focus on explaining your approach clearly, even if you don't finish coding. We're assessing current skill level, not perfection."
  - type: "reflection"
    instructions: "Write 2-3 sentences about your comfort level with Git and what development tools you've used before."

resources:
  core:
    - title: "VS Code Getting Started"
      url: "https://code.visualstudio.com/docs/getstarted/getting-started"
      why: "Official guide for editor setup and basic features"
    - title: "Git Handbook"
      url: "https://guides.github.com/introduction/git-handbook/"
      why: "Comprehensive Git fundamentals in plain English"
    - title: "Algorithm Visualizer"
      url: "https://algorithm-visualizer.org/"
      why: "Interactive tool for understanding algorithms visually"
  enrichment:
    - title: "GitHub Flow Guide"
      url: "https://guides.github.com/introduction/flow/"
    - title: "Command Line Crash Course"
      url: "https://learnpythonthehardway.org/python3/appendixa.html"

speaker_notes:
  beats:
    - "Start with energy and enthusiasm - this is the foundation of their interview success journey"
    - "Address imposter syndrome early - everyone starts somewhere, focus on growth mindset"
    - "Emphasize consistency over perfection - daily practice beats sporadic cramming"
    - "Be hands-on during setup - circulate and help students debug installation issues"
    - "During baseline assessment, remind students this is diagnostic, not evaluative"
    - "End with clear next steps and encourage them to practice Git commands before next week"
  time_cues:
    - minute: 15
      note: "Should be starting environment setup by now - check if anyone needs help with downloads"
    - minute: 45
      note: "Transition to Git fundamentals - make sure everyone has VS Code working first"
    - minute: 70
      note: "Begin baseline assessment - emphasize problem-solving approach over completion"
  demo_steps:
    - "Show VS Code interface tour - file explorer, terminal integration, extensions panel"
    - "Demonstrate git init, add, commit sequence with clear terminal outputs"
    - "Show how to view git log and understand commit history"
    - "Walk through creating GitHub repo and connecting local repo to remote"
  faq:
    - question: "Do I need to memorize all these Git commands?"
      answer: "No! Focus on understanding the workflow. You'll use these commands frequently enough that they'll become natural. Keep a cheat sheet handy."
    - question: "What if I'm already comfortable with a different IDE?"
      answer: "VS Code is recommended for consistency in workshops, but you can use what you're comfortable with. Just make sure you have similar functionality."
    - question: "How difficult will the weekly assessments be?"
      answer: "They'll progressively build in difficulty. Week 0 is baseline, by Week 12 you'll tackle system design. Trust the process and focus on consistent practice."

industry_tip:
  title: "Resume & LinkedIn Essentials"
  bullets:
    - "Keep your resume to ONE PAGE - recruiters spend 6 seconds on first scan"
    - "Use XYZ bullet format: 'Accomplished X by implementing Y which resulted in Z'"
    - "Aim for 500+ LinkedIn connections - engage authentically, not just collecting contacts"
    - "Showcase projects over GPA - demonstrate what you can build, not just what you studied"
    - "GitHub profile should have pinned repositories with README files that explain your projects clearly"
  source: "Success With SCE slides p.5-7"

style:
  theme: "academic"
  layout: "single-column"
  callouts: ["do-dont", "tip", "career"]
  slide_count_target: 22
