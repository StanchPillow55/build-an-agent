id: "week00-setup"
title: "Setup & Baseline"
week: 0
duration: "90 minutes"

objectives:
  - "Set up the IDE with required extensions and workspace settings."
  - "Create a Git branching workflow (feature/release/hotfix) and open a test PR."
  - "Implement a unit-test harness and run a passing local test suite."
  - "Measure baseline problem-solving speed on two LeetCode problems."
  - "Explain how to submit weekly artifacts (code, notes, and reflections)."

agenda:
  - time: "16:00"
    activity: "Welcome, goals, success criteria"
    duration: 5
  - time: "16:05"
    activity: "IDE configuration & workspace conventions"
    duration: 25
  - time: "16:30"
    activity: "Git workflow: branch → commit → PR"
    duration: 25
  - time: "16:55"
    activity: "Testing harness: run & debug"
    duration: 20
  - time: "17:15"
    activity: "Baseline drill & wrap"
    duration: 15

topics:
  - "Setup"

prior_knowledge:
  - "Identify basic CLI usage (cd, ls, mkdir) and PATH concepts."
  - "Describe the difference between compiled vs interpreted tooling."
  - "Recall what unit tests assert and why deterministic tests matter."

activities:
  - type: "lab"
    title: "Environment bring-up"
    time_minutes: 25
    steps:
      - "Create a workspace folder and open it in the IDE."
      - "Install recommended extensions and apply project settings."
      - "Clone the starter repo and run `npm test` to verify the harness."
      - "Open a feature branch and push an initial commit."

assessment:
  - type: "leetcode"
    ids: [53, 121]
    instructions: "Solve LC 53 and LC 121 locally. For each, commit: (1) a tested solution; (2) a 3–5 sentence note that explains the approach and time/space complexity; (3) a short note on your elapsed time and what slowed you down."

resources:
  core:
    - title: "VS Code — Getting Started"
      url: "https://code.visualstudio.com/docs"
      why: "Step-by-step setup and extension management for a consistent dev environment."
    - title: "Atlassian — Git Branching Workflows"
      url: "https://www.atlassian.com/git/tutorials/comparing-workflows/gitflow-workflow"
      why: "Clear patterns for feature/release/hotfix flows used in industry."
    - title: "GitHub Actions — Quickstart"
      url: "https://docs.github.com/actions/quickstart"
      why: "Foundation for CI that you will extend in DevOps weeks."
  enrichment:
    - title: "Git — Everyday Commands"
      url: "https://git-scm.com/docs/giteveryday"
      why: "Reference for the most common day-to-day operations."

speaker_notes:
  beats:
    - "State outcome: a reproducible local dev environment + a passing test harness."
    - "Justify Git branching: isolates work and accelerates code review."
    - "Testing payoff: confidence to refactor later weeks without fear."
    - "Baseline rationale: measure to improve; we'll compare again in Week 12."
    - "Homework hand-in: PR with checklist so TAs can spot issues quickly."
  time_cues:
    - minute: 10
      note: "transition to IDE setup demo."
    - minute: 30
      note: "start Git workflow mini-lab."
    - minute: 55
      note: "run tests and show a failing → passing cycle."
    - minute: 75
      note: "start baseline drill; remind to record time."
  demo_steps:
    - "Show installing extensions from a shared `.vscode/extensions.json`."
    - "Create `feat/baseline-setup` branch; commit a README tweak."
    - "Add a trivial unit test; run watcher; fix a failing assertion."
    - "Open a draft PR and tag it with labels."
  faq:
    - question: "Why not use global Node installations per project?"
      answer: "Project-local toolchains avoid version drift; lock files become trustworthy."
    - question: "What if tests are flaky on my machine?"
      answer: "Check Node version, lockfile, and ensure no reliance on wall-clock or randomness."
    - question: "How much detail is expected in baseline notes?"
      answer: "3–5 sentences per problem: approach, big-O, and one improvement you'll try next time."

industry_tip:
  title: "Resume & LinkedIn Essentials"
  bullets:
    - "Keep your resume to ONE PAGE - recruiters spend 6 seconds on first scan"
    - "Use XYZ bullet format: 'Accomplished X by implementing Y which resulted in Z'"
    - "Aim for 500+ LinkedIn connections - engage authentically, not just collecting contacts"
    - "Showcase projects over GPA - demonstrate what you can build, not just what you studied"
    - "GitHub profile should have pinned repositories with README files that explain your projects clearly"
  source: "Success With SCE slides p.5-7"

style:
  theme: "academic"
  layout: "two-column"
  callouts: ["do-dont", "tip"]
  slide_count_target: 22
