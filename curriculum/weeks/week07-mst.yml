id: "week07-mst"
title: "Graphs II — MST & SSSP"
week: 7
duration: "90 minutes"
topics: ["DSA","Graphs"]
objectives:
  - "Implement Kruskal's algorithm with DSU and prove the cut property informally."
  - "Implement Dijkstra with a binary heap and analyze heap operations."
  - "Compare Prim vs Kruskal on sparse vs dense graphs and justify choice."
agenda:
  - time: "16:00"
    activity: "Warm-up: MST properties"
    duration: 10
  - time: "16:10"
    activity: "Kruskal + DSU"
    duration: 20
  - time: "16:30"
    activity: "Lab: Dijkstra with PQ"
    duration: 25
  - time: "16:55"
    activity: "Drill: flight routes"
    duration: 20
  - time: "17:15"
    activity: "Wrap up session"
    duration: 5
resources:
  core:
    - title: "MIT OCW 6.006 — MST & Shortest Paths"
      url: "https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-fall-2011/"
      why: "Proof ideas and complexity guarantees for MST/SSSP."
    - title: "Algorithm Visualizer — Dijkstra"
      url: "https://algorithm-visualizer.org/"
      why: "Intuition for relaxation and frontier growth."
    - title: "Tech Interview Handbook — Graph Shortest Paths"
      url: "https://www.techinterviewhandbook.org/algorithms/graph/"
      why: "Patterns and pitfalls to mention aloud."
  enrichment:
    - title: "6.851 — Advanced Data Structures (for PQ variants)"
      url: "https://ocw.mit.edu/courses/6-851-advanced-data-structures-spring-2012/"
      why: "Explore alternative priority queues and their trade-offs."
prior_knowledge:
  - "Compute big-O for sorting edges and union/find operations."
  - "Explain negative edge constraints for SSSP."
activities:
  - type: "lab"
    title: "Implement SSSP and MST"
    time_minutes: 25
    steps:
      - "Code Kruskal with DSU; verify spanning property and acyclicity."
      - "Implement Dijkstra with a binary heap; log relaxations."
      - "Generate sparse vs dense graphs and compare run times."
      - "Write a short summary: which algorithm wins and why."
assessment:
  - type: "leetcode"
    ids: [743, 787]
    instructions: "For LC 743, implement Dijkstra with a PQ; justify complexity O(E log V). For LC 787, discuss why simple Dijkstra fails and how you modified the state (stops constraint)."
style:
  theme: "academic"
  layout: "two-column"
  callouts: ["do-dont", "tip"]
  slide_count_target: 22
speaker_notes:
  beats:
    - "MST cut & cycle properties guide correctness."
    - "Dijkstra's invariant: current PQ min has final shortest distance."
    - "Sparse vs dense: data structure choice matters."
    - "When negatives appear, pick Bellman-Ford or SPFA."
  time_cues:
    - minute: 10
      note: "sketch Kruskal steps."
    - minute: 30
      note: "start Dijkstra; highlight relaxations."
    - minute: 70
      note: "wrap with performance comparison."
  demo_steps:
    - "Trace one Kruskal run on a 6-node graph."
    - "Show PQ push/pop and distance updates."
  faq:
    - question: "Why not Prim always?"
      answer: "Prim with Fibonacci heaps has nice bounds but higher constants; implementation complexity matters."
