id: "week12-devops"
title: "ML/AI for SWE — Small Models & Serving"
week: 12
duration: "90 minutes"
topics: ["ML"]
objectives:
  - "Implement a regression and a tree-based model and evaluate bias/variance."
  - "Create a simple embedding-based search and explain cosine similarity."
  - "Deploy a model behind a REST endpoint and measure latency."
agenda:
  - time: "16:00"
    activity: "Warm-up: bias vs variance"
    duration: 10
  - time: "16:10"
    activity: "Models: regression & trees"
    duration: 20
  - time: "16:30"
    activity: "Embeddings & search"
    duration: 25
  - time: "16:55"
    activity: "Serving: REST endpoint"
    duration: 20
  - time: "17:15"
    activity: "Wrap up session"
    duration: 5
resources:
  core:
    - title: "Scikit-learn — Getting Started"
      url: "https://scikit-learn.org/stable/getting_started.html"
      why: "Baseline models with consistent APIs for quick iteration."
    - title: "FastAPI — First Steps"
      url: "https://fastapi.tiangolo.com/tutorial/first-steps/"
      why: "Lightweight serving stack for model endpoints."
    - title: "Embeddings — Primer"
      url: "https://developers.google.com/machine-learning/crash-course/embeddings/intro-to-embeddings"
      why: "Conceptual grounding before coding."
  enrichment:
    - title: "Kaggle — Mini Competition"
      url: "https://www.kaggle.com/competitions"
      why: "Practice experimental rigor with a public dataset."
prior_knowledge:
  - "Use Python notebooks and virtual environments."
  - "Explain train/validation/test splits."
activities:
  - type: "lab"
    title: "Train → Embed → Serve"
    time_minutes: 25
    steps:
      - "Train a regression and a small tree model; report metrics."
      - "Compute embeddings for short texts; implement cosine similarity search."
      - "Expose `/predict` and `/search` endpoints with FastAPI."
      - "Load test with a small client; record median and p95 latency."
assessment:
  - type: "project"
    instructions: "Submit a repo link with a notebook (metrics & plots), an API server with `/predict` and `/search`, and a short latency report with one optimization you tried."
style:
  theme: "academic"
  layout: "two-column"
  callouts: ["do-dont", "tip"]
  slide_count_target: 22
speaker_notes:
  beats:
    - "Bias/variance trade-off: show under/overfit curves."
    - "Embeddings turn text into vectors; cosine captures semantic proximity."
    - "Serving concerns: serialization, warm-up, concurrency."
    - "Measure before optimizing; p95 tells the real story."
  time_cues:
    - minute: 10
      note: "fit a tiny model live."
    - minute: 30
      note: "compute embeddings and run a demo query."
    - minute: 55
      note: "hit the REST endpoint with a client."
  demo_steps:
    - "Train and print metrics."
    - "Show a nearest-neighbors search."
    - "Spin up FastAPI; run a simple load test."
  faq:
    - question: "Is GPU required?"
      answer: "No; we'll use CPU-friendly models to focus on engineering and evaluation."
