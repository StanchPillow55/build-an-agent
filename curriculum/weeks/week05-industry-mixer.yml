id: "week05-industry-mixer"
title: "Industry Mixer — Technical Interview Breakouts"
week: 5
duration: "90 minutes"

objectives:
  - "Present a concise 60-second problem-solving walkthrough using a structured template."
  - "Apply a DSA template (hash map, two-pointers, sliding window, or heap) to a new prompt."
  - "Solve one medium-difficulty problem collaboratively and justify the chosen approach."
  - "Test your explanation with a peer and refine based on feedback."

agenda:
  - time: "16:00"
    activity: "Mini-deck: interview pacing & templates (10 min)"
    duration: 10
  - time: "16:10"
    activity: "Breakout #1: DSA practice (pairs)"
    duration: 20
  - time: "16:30"
    activity: "Breakout #2: explanation swap"
    duration: 25
  - time: "16:55"
    activity: "Breakout #3: system-design micro-prompt"
    duration: 20
  - time: "17:15"
    activity: "Share-outs & next steps"
    duration: 15

topics:
  - "DSA"
  - "System-Design"

prior_knowledge:
  - "Recall 2–3 core patterns (hash map, sliding window, heap)."
  - "Outline a basic client-service-database architecture."

activities:
  - type: "lab"
    title: "Breakout rotations"
    time_minutes: 45
    steps:
      - "Pick a DSA prompt; silently outline inputs, outputs, constraints (2 min)."
      - "State your approach in 60 seconds using the template: **Given → Constraints → Strategy → Complexity**."
      - "Code the core function and run one non-trivial test."
      - "Swap roles; partner restates your solution back to you and offers one improvement."

assessment:
  - type: "reflection"
    instructions: "Submit a 1-page reflection with: (1) the prompt you attempted; (2) the pattern you chose and why; (3) final complexity; (4) one improvement for clarity under time pressure."

resources:
  core:
    - title: "Tech Interview Handbook — Answer Frameworks"
      url: "https://www.techinterviewhandbook.org/behavioral/"
      why: "Concise structures to pace answers; adapt for technical explanations."
    - title: "Algorithm Visualizer — Patterns at a glance"
      url: "https://algorithm-visualizer.org/"
      why: "Quick recall of DSA patterns for warm-ups."
    - title: "ByteByteGo — System Design mini-prompts"
      url: "https://bytebytego.com/"
      why: "Short prompts to spark architectural discussion."
  enrichment:
    - title: "LeetCode Discuss — Patterns"
      url: "https://leetcode.com/discuss/general-discussion/460599/blind-75-leetcode-questions"
      why: "Community-curated problem sets by pattern."

speaker_notes:
  beats:
    - "Normalize anxiety: we'll focus on pacing and structure."
    - "Template unlock: Given → Constraints → Strategy → Complexity."
    - "Feedback model: restate, praise, suggest, question."
    - "System design: start with APIs + data model before scaling."
  time_cues:
    - minute: 0
      note: "send breakout instructions."
    - minute: 30
      note: "rotate and emphasize complexity statement."
    - minute: 75
      note: "gather share-outs; assign reflection."
  demo_steps:
    - "Model a 60-second explanation for a simple window problem."
    - "Sketch a tiny URL shortener API and data model."
  faq:
    - question: "Should I code or talk first?"
      answer: "Talk first: confirm understanding, constraints, and trade-offs."
    - question: "How detailed should complexity be?"
      answer: "Name big-O for time and space and what drives each term."

style:
  theme: "academic"
  layout: "two-column"
  callouts: ["do-dont", "tip"]
  slide_count_target: 16
