id: "week08-greedy"
title: "Greedy & DP Mastery"
week: 8
duration: "90 minutes"
topics: ["DSA","DP"]
objectives:
  - "Transform a brute-force interval scheduling solution into a DP with optimal substructure."
  - "Implement bottom-up DP for coin change and LIS and compare to greedy heuristics."
  - "Explain correctness via exchange arguments and subproblem independence."
agenda:
  - time: "16:00"
    activity: "Warm-up: greedy fails (counterexample)"
    duration: 10
  - time: "16:10"
    activity: "Exchange arguments & substructure"
    duration: 20
  - time: "16:30"
    activity: "Lab: bottom-up DP"
    duration: 25
  - time: "16:55"
    activity: "Drill: coin change & LIS"
    duration: 20
  - time: "17:15"
    activity: "Wrap up session"
    duration: 5
resources:
  core:
    - title: "MIT OCW 6.006 — Dynamic Programming"
      url: "https://ocw.mit.edu/courses/6-006-introduction-to-algorithms-fall-2011/"
      why: "Foundational patterns and proofs of correctness."
    - title: "Algorithm Visualizer — DP"
      url: "https://algorithm-visualizer.org/"
      why: "Visualize table fills and state transitions."
    - title: "Tech Interview Handbook — DP Patterns"
      url: "https://www.techinterviewhandbook.org/algorithms/dynamic-programming/"
      why: "Interviewer-friendly recipes to structure answers."
  enrichment:
    - title: "6.851 — Advanced Data Structures (optional)"
      url: "https://ocw.mit.edu/courses/6-851-advanced-data-structures-spring-2012/"
      why: "Context for when DP meets specialized structures."
prior_knowledge:
  - "Define overlapping subproblems and optimal substructure."
  - "Trace a 1D or 2D DP table update."
activities:
  - type: "lab"
    title: "From greedy to DP"
    time_minutes: 25
    steps:
      - "Start with a greedy attempt; intentionally fail on a counterexample."
      - "Define DP state, transitions, and base cases."
      - "Implement bottom-up with a table and reconstruct the solution."
      - "Write a 4-sentence correctness argument (exchange or induction)."
assessment:
  - type: "leetcode"
    ids: [322, 300]
    instructions: "For LC 322, implement bottom-up DP and explain why greedy fails on certain coin systems. For LC 300, implement O(n log n) patience sorting approach and compare to O(n^2) DP."
style:
  theme: "academic"
  layout: "two-column"
  callouts: ["do-dont", "tip"]
  slide_count_target: 22
speaker_notes:
  beats:
    - "Greedy is fast but fragile; find counterexamples early."
    - "DP needs a crisp state and recurrence; don't guess—derive."
    - "Proof sketch via exchange arguments builds interviewer trust."
    - "Patience sorting intuition for LIS."
    - "Compare complexities and memory footprints."
  time_cues:
    - minute: 10
      note: "present a failing greedy example."
    - minute: 30
      note: "start coding DP with explicit state notes."
    - minute: 70
      note: "compare complexities and memory."
  demo_steps:
    - "Walk through coin change DP table fill."
    - "Demonstrate LIS tails array updates."
  faq:
    - question: "When do I choose top-down vs bottom-up?"
      answer: "Top-down for sparse states and clarity; bottom-up for tight loops and memory control."
