name: Build and Deploy Slides

on:
  push:
    branches: [ main, slides-automation ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Validate Content
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install Node dependencies
      run: npm ci

    - name: Validate session YAML files
      run: npm run validate:sessions

    - name: Upload validation results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: validation-results
        path: |
          curriculum/weeks/*.yml
          curriculum/events/*.yml

  build-slides:
    name: Build Slide Decks
    runs-on: ubuntu-latest
    needs: validate

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install Chromium for PDF generation
      run: |
        sudo apt-get update
        sudo apt-get install -y chromium-browser
        export PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true
        export PUPPETEER_EXECUTABLE_PATH=`which chromium-browser`

    - name: Build slide decks
      run: npm run build:slides
      env:
        PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium-browser

    - name: Generate PDFs and HTML
      run: npm run export:pdf
      env:
        PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium-browser

    - name: Build catalog index
      run: |
        node -e "
        const fs = require('fs');
        const path = require('path');

        const weeks = fs.readdirSync('dist/pdf')
          .filter(f => f.endsWith('.pdf'))
          .sort()
          .map(f => {
            const name = f.replace('.pdf', '');
            const week = name.match(/week(\d+)/)?.[1] || '0';
            const title = name.replace(/week\d+-/, '').replace(/-/g, ' ');
            return { name, week: parseInt(week), title, pdf: f, html: f.replace('.pdf', '.html') };
          });

        const html = \`<!DOCTYPE html>
        <html>
        <head>
          <title>SJSU Hoplite Club - SWE Interview Master Plan</title>
          <style>
            body { font-family: Arial, sans-serif; max-width: 1200px; margin: 0 auto; padding: 2rem; }
            .header { text-align: center; margin-bottom: 2rem; }
            .week-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1rem; }
            .week-card { border: 1px solid #ddd; border-radius: 8px; padding: 1rem; }
            .week-title { color: #0055A2; font-weight: bold; margin-bottom: 0.5rem; }
            .week-links a { margin-right: 1rem; color: #0055A2; text-decoration: none; }
            .week-links a:hover { text-decoration: underline; }
          </style>
        </head>
        <body>
          <div class="header">
            <h1>🚀 SWE Interview Master Plan</h1>
            <h2>Fall 2025 Workshop Slides</h2>
            <p>SJSU Hoplite Club • 12-Week Technical Interview Preparation Program</p>
          </div>

          <div class="week-grid">
            \${weeks.map(w => \`
              <div class="week-card">
                <div class="week-title">Week \${w.week}: \${w.title}</div>
                <div class="week-links">
                  <a href="pdf/\${w.pdf}">📄 PDF</a>
                  <a href="html/\${w.html}">🌐 HTML</a>
                  <a href="notes/\${w.name}-speaker-notes.md">📋 Notes</a>
                </div>
              </div>
            \`).join('')}
          </div>

          <div style="margin-top: 2rem; text-align: center; color: #666;">
            <p>Generated on \${new Date().toLocaleDateString()}</p>
            <p><a href="https://github.com/StanchPillow55/build-an-agent">📂 Source Repository</a></p>
          </div>
        </body>
        </html>\`;

        fs.writeFileSync('dist/index.html', html);
        "

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: slide-builds
        path: |
          dist/
          slides/*.md
          notes/*.md
        retention-days: 30

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-slides
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/slides-automation'

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Download build artifacts
      uses: actions/download-artifact@v4
      with:
        name: slide-builds
        path: dist/

    - name: Setup Pages
      uses: actions/configure-pages@v4

    - name: Upload to GitHub Pages
      uses: actions/upload-pages-artifact@v3
      with:
        path: dist/

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

  notify:
    name: Notify Results
    runs-on: ubuntu-latest
    needs: [validate, build-slides, deploy]
    if: always()

    steps:
    - name: Create summary
      run: |
        echo "## 📊 Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        if [ "${{ needs.validate.result }}" == "success" ]; then
          echo "✅ **Validation**: All session files passed schema validation" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **Validation**: Some session files failed validation" >> $GITHUB_STEP_SUMMARY
        fi

        if [ "${{ needs.build-slides.result }}" == "success" ]; then
          echo "✅ **Build**: Slides generated successfully" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **Build**: Slide generation failed" >> $GITHUB_STEP_SUMMARY
        fi

        if [ "${{ needs.deploy.result }}" == "success" ]; then
          echo "✅ **Deploy**: Published to GitHub Pages" >> $GITHUB_STEP_SUMMARY
          echo "🌐 **Live Site**: https://stanchpillow55.github.io/build-an-agent/" >> $GITHUB_STEP_SUMMARY
        elif [ "${{ needs.deploy.result }}" == "skipped" ]; then
          echo "⏭️ **Deploy**: Skipped (not main branch)" >> $GITHUB_STEP_SUMMARY
        else
          echo "❌ **Deploy**: Deployment failed" >> $GITHUB_STEP_SUMMARY
        fi

        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "**Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
